<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#3A857E" />
    <meta name="description" content="寻虫记 · 昆虫识别与收藏" />
    <link rel="icon" type="image/png" sizes="32x32" href="./brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./brand/icon-64.png" />
    <link rel="apple-touch-icon" href="./brand/apple-touch-icon.png" />
    <link rel="manifest" href="./brand/manifest.webmanifest" />
    <title>寻虫记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e8efe9;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f5f5f4;
        transition: opacity 0.28s ease, visibility 0.28s ease;
      }
      #boot-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash .boot-mark {
        width: min(42vw, 168px);
        height: min(42vw, 168px);
        border-radius: 28px;
        overflow: hidden;
        background: #fff url("./brand/splash-256.png") center / contain no-repeat;
        box-shadow: 0 16px 40px rgba(58, 133, 126, 0.18);
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      #boot-splash .boot-mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: #fff;
      }
      #boot-splash .boot-caption {
        margin: 18px 0 0;
        text-align: center;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: #3a857e;
      }
      #boot-splash .boot-hint {
        display: none;
        box-sizing: border-box;
        max-width: 22rem;
        margin: 16px auto 0;
        padding: 12px 14px;
        border-radius: 12px;
        background: #fff;
        color: #3a4a48;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.55;
        letter-spacing: 0;
        text-align: left;
      }
      #boot-splash .boot-hint a {
        color: #2f6f69;
        word-break: break-all;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 0.78;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-mark {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DX3j4954.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DfQtefUg.css">
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-live="polite">
      <div>
        <div class="boot-mark">
          <img src="./brand/splash-256.png" width="168" height="168" alt="寻虫记" onerror="this.style.visibility='hidden'" />
        </div>
        <p class="boot-caption" id="boot-caption">正在打开寻虫记</p>
        <p class="boot-hint" id="boot-hint">
          这一页只是启动画面，不能点。你现在打开的是本地下载的网页文件，程序进不来。请把下面这一整行复制到地址栏打开：
          <br />
          <a id="boot-demo-link" href="https://holycube.github.io/xunchongji-web/">https://holycube.github.io/xunchongji-web/</a>
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById("boot-splash");
        var hint = document.getElementById("boot-hint");
        var caption = document.getElementById("boot-caption");
        var isLocalFile = location.protocol === "file:";
        if (isLocalFile && hint) {
          hint.style.display = "block";
          if (caption) caption.textContent = "还没进入软件";
          return;
        }
        window.setTimeout(function () {
          if (splash && !splash.classList.contains("is-leaving")) {
            splash.classList.add("is-leaving");
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
